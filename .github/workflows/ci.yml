name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-analyze:
    name: Tests + SonarCloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871  # v4.2.1
        with:
          fetch-depth: 0  # Sonar necesita el historial completo para detectar código nuevo

      # ---------- Backend: pytest + cobertura ----------
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Instalar dependencias del backend
        run: pip install --require-hashes --only-binary ":all:" -r backend/requirements.lock

      - name: pytest con cobertura
        working-directory: backend
        run: pytest --cov=. --cov-report=xml --cov-report=term

      # ---------- Frontend: Vitest + cobertura ----------
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Vitest con cobertura
        working-directory: frontend
        run: npm run test:coverage

      # ---------- Análisis de calidad ----------
      - name: SonarCloud
        uses: SonarSource/sonarqube-scan-action@2500896589ef8f7247069a56136f8dc177c27ccf  # v5.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
