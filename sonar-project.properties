# ==========================================
# Identificación del Proyecto en SonarCloud
# ==========================================
sonar.organization=nicollep16
sonar.projectKey=NicolleP16_general-people-finance-tracker
sonar.projectName=General People Finance Tracker
sonar.sourceEncoding=UTF-8

# ==========================================
# Rutas de Código Fuente y Pruebas
# ==========================================
sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/src
sonar.test.inclusions=**/test_*.py,**/tests.py,**/__tests__/**,**/*.test.js,**/*.test.jsx

# ==========================================
# Mapeo de Cobertura de Código (HT-04)
# ==========================================
# Reporte generado por Pytest (Backend)
sonar.python.coverage.reportPaths=backend/coverage.xml

# Reporte generado por Vitest (Frontend)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ==========================================
# Exclusiones (Para no distorsionar las métricas)
# ==========================================
sonar.exclusions=**/node_modules/**, \
                 **/migrations/**, \
                 **/.venv/**, \
                 **/venv/**, \
                 **/dist/**, \
                 **/coverage/**, \
                 backend/core/settings.py, \
                 backend/core/wsgi.py, \
                 backend/core/asgi.py, \
                 backend/manage.py

# Script de datos de ejemplo: no es código de la aplicación
sonar.coverage.exclusions=backend/seed_data.py
