version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Carga las credenciales de Supabase desde backend/.env
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - finance-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finance_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Volumen anónimo para evitar que node_modules de Windows sobreescriba el del contenedor Linux
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Asegura detección de cambios en tiempo real en Windows
    depends_on:
      - backend
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge